[project]
name = "energy-consumption"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LKH", email = "airforce940706@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
    "uvicorn>=0.35.0",
]

[project.scripts]
energy-consumption = "energy_consumption:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pypdf>=6.16.2",
    "python-pptx>=1.0.2",
]
